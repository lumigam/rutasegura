name: Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'assets/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bd?schema=public
      JWT_SECRET: 0123456789abcdef0123456789abcdef
      ADMIN_EMAIL: admin@example.org
      ADMIN_PASSWORD: temporary-build-password
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Compilar y revisar Android
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew test lint assembleDebug bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ruta-segura-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
